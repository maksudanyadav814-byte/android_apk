name: Build Native Android APK

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository Code
uses: actions/checkout@v4

  - name: Setup JDK 17 Environment
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  # STREAMING_CHUNK:Setting permissions and building gradle apk...
  - name: Grant Execute Permission for Gradle Wrapper
    run: chmod +x gradlew || true

  - name: Build Android Debug APK with Gradle
    run: |
      if [ -f "./gradlew" ]; then
        ./gradlew assembleDebug --stacktrace
      else
        gradle assembleDebug --stacktrace
      fi

  # STREAMING_CHUNK:Uploading generated APK artifact...
  - name: Upload Debug APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: FastStore-Native-App
      path: app/build/outputs/apk/debug/app-debug.apk
